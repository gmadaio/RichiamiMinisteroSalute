name: Pubblica Feed Richiami (GitHub Pages)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/generate-recalls-json.mjs'
      - '.github/workflows/publish-recalls-feed.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pagesa
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Genera recalls.json e privacy.html
        run: node scripts/generate-recalls-json.mjs dist-pages/recalls.json

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica artefatto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
